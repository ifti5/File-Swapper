<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Merge Excel/CSV Columns — Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  body { padding: 30px; }
  .preview-table { max-height: 320px; overflow:auto; display:block; }
  .replaced { background: #fff3cd; }
  .small-note { font-size: .9rem; color: #6c757d; }
</style>
</head>
<body>
<div class="container">
  <h3 class="mb-3">Merge column from File-2 → File-1 (Browser-only)</h3>

  <div class="card mb-3">
    <div class="card-body">
      <form id="uploadForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">File-1 (Main)</label>
          <input class="form-control" type="file" id="file1" accept=".xlsx,.xls,.csv" />
        </div>
        <div class="col-md-6">
          <label class="form-label">File-2 (Source)</label>
          <input class="form-control" type="file" id="file2" accept=".xlsx,.xls,.csv" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Select sheet (File-1)</label>
          <select id="sheetSel1" class="form-select"></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Select sheet (File-2)</label>
          <select id="sheetSel2" class="form-select"></select>
        </div>

        <div class="col-md-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="hasHeader" checked>
            <label class="form-check-label" for="hasHeader">First row is header</label>
            <div class="small-note">Uncheck if files do not have headers; synthetic headers will be generated.</div>
          </div>
        </div>

        <!-- Row-range selection -->
        <div class="col-md-3">
          <label class="form-label">File-1 Start Row</label>
          <input type="number" id="f1StartRow" class="form-control" min="1" value="2" />
        </div>
        <div class="col-md-3">
          <label class="form-label">File-1 End Row</label>
          <input type="number" id="f1EndRow" class="form-control" min="2" value="20" />
        </div>
        <div class="col-md-3">
          <label class="form-label">File-2 Start Row</label>
          <input type="number" id="f2StartRow" class="form-control" min="1" value="2" />
        </div>
        <div class="col-md-3">
          <label class="form-label">File-2 End Row</label>
          <input type="number" id="f2EndRow" class="form-control" min="2" value="20" />
        </div>

        <div class="col-12">
          <button type="button" id="loadBtn" class="btn btn-primary">Load files & show columns</button>
          <button type="button" id="resetBtn" class="btn btn-link">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <div id="mainControls" class="d-none">
    <div class="card mb-3">
      <div class="card-body">
        <h5>Select columns</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">File-1 — Target column to replace</label>
            <select id="targetCol" class="form-select"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label">File-2 — Source column to copy</label>
            <select id="sourceCol" class="form-select"></select>
          </div>
          <div class="col-12">
            <button type="button" class="btn btn-success" id="processBtn">Process & Download</button>
            <button type="button" class="btn btn-outline-secondary" id="previewBtn">Preview without download</button>
          </div>
        </div>
      </div>
    </div>

    <div id="infoArea" class="mb-3"></div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-body">
            <h6>File-1 Preview (first 20 rows)</h6>
            <div id="preview1" class="preview-table"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6 mb-3">
        <div class="card">
          <div class="card-body">
            <h6>File-2 Preview (first 20 rows)</h6>
            <div id="preview2" class="preview-table"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="resultPreviewCard" class="card mb-3 d-none">
      <div class="card-body">
        <h6>Result Preview (first 20 rows) — replaced cells highlighted</h6>
        <div id="resultPreview" class="preview-table"></div>
        <div class="mt-2">
          <button type="button" id="downloadBtn" class="btn btn-primary">Download XLSX</button>
          <button type="button" id="downloadCsvBtn" class="btn btn-outline-primary">Download CSV</button>
        </div>
      </div>
    </div>
  </div>

  <div id="alertPlaceholder"></div>
</div>

<script>
const file1El = document.getElementById('file1');
const file2El = document.getElementById('file2');
const sheetSel1 = document.getElementById('sheetSel1');
const sheetSel2 = document.getElementById('sheetSel2');
const hasHeaderEl = document.getElementById('hasHeader');
const loadBtn = document.getElementById('loadBtn');
const resetBtn = document.getElementById('resetBtn');
const mainControls = document.getElementById('mainControls');
const targetColSel = document.getElementById('targetCol');
const sourceColSel = document.getElementById('sourceCol');
const preview1Div = document.getElementById('preview1');
const preview2Div = document.getElementById('preview2');
const processBtn = document.getElementById('processBtn');
const previewBtn = document.getElementById('previewBtn');
const infoArea = document.getElementById('infoArea');
const resultPreviewCard = document.getElementById('resultPreviewCard');
const resultPreviewDiv = document.getElementById('resultPreview');
const downloadBtn = document.getElementById('downloadBtn');
const downloadCsvBtn = document.getElementById('downloadCsvBtn');

let file1Sheets = null, file2Sheets = null;
let file1Data = null, file2Data = null, finalData = null;

function showAlert(msg, type='danger'){
  document.getElementById('alertPlaceholder').innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">
  ${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
}

async function readWorkbookAndSheets(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('File read error'));
    reader.onload = e=>{
      try{
        const data = e.target.result;
        const wb = XLSX.read(data, { type: 'array' });
        const sheets = wb.SheetNames.map(name=>{
          const ws = wb.Sheets[name];
          const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          return { name, array: arr };
        });
        resolve({ workbook: wb, sheets });
      }catch(err){
        reject(new Error('Cannot read file. It may be password-protected or unsupported.'));
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

function isRowEmpty(row){
  if(!row) return true;
  return row.every(c=>c===null||c===undefined||String(c).trim()==='');
}

function trimEmptyRowsAndCols(arr){
  if(!arr||arr.length===0) return arr;
  let top=0,bottom=arr.length-1;
  while(top<=bottom && isRowEmpty(arr[top])) top++;
  while(bottom>=top && isRowEmpty(arr[bottom])) bottom--;
  if(top>bottom) return [];
  let trimmed = arr.slice(top,bottom+1);
  let maxCol=0;
  for(const row of trimmed){
    row.forEach((v,c)=>{ if(v!=='' && v!==null && v!==undefined) if(c>maxCol) maxCol=c; });
  }
  trimmed = trimmed.map(r=>{
    const newRow=[];
    for(let c=0;c<=maxCol;c++) newRow.push(r[c]===undefined?'':r[c]);
    return newRow;
  });
  return trimmed;
}

function renderPreview(arr, limit=20){
  if(!arr||arr.length===0) return '<div class="small-note">No data</div>';
  const rows = arr.slice(0,limit);
  let html='<div style="overflow:auto;"><table class="table table-sm table-bordered mb-0"><thead><tr>';
  const maxCols = Math.max(...rows.map(r=>r.length));
  for(let c=0;c<maxCols;c++) html+=`<th>${rows[0][c]||'Col '+(c+1)}</th>`;
  html+='</tr></thead><tbody>';
  for(let r=1;r<rows.length;r++){
    html+='<tr>';
    for(let c=0;c<maxCols;c++){
      html+=`<td>${rows[r][c]||''}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  return html;
}

function fillSelectors(headers1, headers2){
  targetColSel.innerHTML=''; sourceColSel.innerHTML='';
  headers1.forEach((h,i)=>{
    const opt = document.createElement('option');
    opt.value=i; opt.textContent=`${i+1}. ${h||'Col '+(i+1)}`;
    targetColSel.appendChild(opt);
  });
  headers2.forEach((h,i)=>{
    const opt = document.createElement('option');
    opt.value=i; opt.textContent=`${i+1}. ${h||'Col '+(i+1)}`;
    sourceColSel.appendChild(opt);
  });
}

function sortRowsByFirstColumn(data){
  const header = data[0];
  const rows = data.slice(1);
  rows.sort((a,b)=>{
    const valA=parseFloat(a[0])||0, valB=parseFloat(b[0])||0;
    return valA-valB;
  });
  return [header,...rows];
}

loadBtn.addEventListener('click', async ()=>{
  if(!file1El.files[0]||!file2El.files[0]){ showAlert('Please select both files','warning'); return;}
  try{
    file1Sheets = (await readWorkbookAndSheets(file1El.files[0])).sheets;
    file2Sheets = (await readWorkbookAndSheets(file2El.files[0])).sheets;

    sheetSel1.innerHTML=''; sheetSel2.innerHTML='';
    file1Sheets.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${i+1}: ${s.name}`; sheetSel1.appendChild(o); });
    file2Sheets.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${i+1}: ${s.name}`; sheetSel2.appendChild(o); });

    const chosen1 = trimEmptyRowsAndCols(file1Sheets[parseInt(sheetSel1.value)].array);
    const chosen2 = trimEmptyRowsAndCols(file2Sheets[parseInt(sheetSel2.value)].array);
    const hasHeader = hasHeaderEl.checked;
    const header1 = hasHeader?chosen1[0]:chosen1[0].map((_,i)=>`Col ${i+1}`);
    const header2 = hasHeader?chosen2[0]:chosen2[0].map((_,i)=>`Col ${i+1}`);
    file1Data = chosen1; file2Data = chosen2;

    mainControls.classList.remove('d-none');
    fillSelectors(header1, header2);
    preview1Div.innerHTML=renderPreview(file1Data);
    preview2Div.innerHTML=renderPreview(file2Data);
    infoArea.innerHTML=`<div class="alert alert-info">File-1 rows: ${file1Data.length-1}, File-2 rows: ${file2Data.length-1}</div>`;
  }catch(err){ console.error(err); showAlert(err.message,'danger'); }
});

resetBtn.addEventListener('click', ()=>{
  file1El.value=''; file2El.value=''; preview1Div.innerHTML=''; preview2Div.innerHTML='';
  mainControls.classList.add('d-none'); resultPreviewCard.classList.add('d-none'); file1Sheets=file2Sheets=file1Data=file2Data=finalData=null;
});

function processData(download=true){
  if(!file1Data||!file2Data){ showAlert('Load files first','warning'); return;}
  const hasHeader = hasHeaderEl.checked;
  const target = parseInt(targetColSel.value,10);
  const source = parseInt(sourceColSel.value,10);

  // row range inputs
  const f1Start = parseInt(document.getElementById('f1StartRow').value,10)-1;
  const f1End = parseInt(document.getElementById('f1EndRow').value,10);
  const f2Start = parseInt(document.getElementById('f2StartRow').value,10)-1;
  const f2End = parseInt(document.getElementById('f2EndRow').value,10);

  const d1 = file1Data.slice(f1Start,f1End).map(r=>r.slice());
  const d2 = file2Data.slice(f2Start,f2End).map(r=>r.slice());

  if(d1.length!==d2.length){ showAlert('Selected row counts mismatch','warning'); return;}

  const sorted = sortRowsByFirstColumn([file1Data[0], ...d1]).slice(1);
  sorted.forEach((row,i)=>row[target]=d2[i][source]);

  finalData = [
    ...file1Data.slice(0,f1Start),
    ...sorted,
    ...file1Data.slice(f1End)
  ];

  resultPreviewDiv.innerHTML = renderPreview(finalData);
  resultPreviewCard.classList.remove('d-none');

  if(download){
    const ws = XLSX.utils.aoa_to_sheet(finalData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Result');
    XLSX.writeFile(wb,'Merged_Result.xlsx');
  }
}

processBtn.addEventListener('click',()=>processData(true));
previewBtn.addEventListener('click',()=>processData(false));

downloadBtn.addEventListener('click',()=>{
  if(!finalData){ showAlert('Process first','warning'); return;}
  const ws = XLSX.utils.aoa_to_sheet(finalData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Result');
  XLSX.writeFile(wb,'Merged_Result.xlsx');
});

downloadCsvBtn.addEventListener('click',()=>{
  if(!finalData){ showAlert('Process first','warning'); return;}
  const ws=XLSX.utils.aoa_to_sheet(finalData);
  const csv=XLSX.utils.sheet_to_csv(ws);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='Merged_Result.csv'; a.click(); URL.revokeObjectURL(url);
});
</script>
</body>
</html>
